[package]
name = "mcp251xfd-examples-rp2040"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone workspace: keeps embassy/cortex-m deps out of the library's tree.
[workspace]

[dependencies]
mcp251xfd = { path = "../..", features = ["async", "defmt"] }
embedded-can = "0.4"

embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "0.4", features = ["defmt", "time-driver", "critical-section-impl", "rp2040"] }
embassy-time = { version = "0.4", features = ["defmt"] }
embassy-sync = "0.6"
embassy-embedded-hal = "0.3"

cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
static_cell = "2"
# thumbv6m (Cortex-M0+) lacks native CAS; static_cell's internal
# portable-atomic needs the critical-section backend instead. Cargo unifies
# this feature across the whole portable-atomic dependency graph.
portable-atomic = { version = "1", features = ["critical-section"] }
# Transitive dependency of embassy-rp (fixed-point types for PWM/PIO). Pinned
# directly: fixed 1.31+ raises its MSRV to 1.93, newer than some supported
# toolchains, and this crate has no workspace-level Cargo.lock to freeze it.
fixed = "=1.30.0"

[profile.release]
debug = 2
lto = true
opt-level = "z"
